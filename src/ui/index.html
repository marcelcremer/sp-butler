<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SP Butler</title>
    <style>
      /* Theme variables and the UI kit reset are injected by Super Productivity. */
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        font-family: var(--font-primary-stack, system-ui, sans-serif);
        color: var(--text-color, #222);
        background: var(--bg, #fff);
        font-size: 14px;
      }
      [hidden] { display: none !important; }
      header {
        display: flex;
        gap: var(--s, 8px);
        align-items: center;
        padding: var(--s, 8px);
        border-bottom: 1px solid var(--divider-color, #ddd);
      }
      header .spacer { flex: 1; }
      .tab { background: transparent; border: none; padding: 4px 8px; cursor: pointer; opacity: 0.7; }
      .tab.active { opacity: 1; border-bottom: 2px solid var(--c-primary, #1976d2); }
      .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      #log { flex: 1; overflow-y: auto; padding: var(--s, 8px); display: flex; flex-direction: column; gap: var(--s, 8px); }
      .msg { max-width: 92%; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .msg-user { align-self: flex-end; background: var(--c-primary, #1976d2); color: #fff; }
      .msg-assistant { align-self: flex-start; background: var(--card-bg, #f3f3f3); box-shadow: var(--whiteframe-shadow-1dp, none); }
      .msg-error { align-self: stretch; border: 1px solid var(--c-warn, #d32f2f); color: var(--c-warn, #d32f2f); }
      .msg-meta { margin-top: 4px; font-size: 11px; opacity: 0.6; }
      .hint { margin: var(--s, 8px); padding: var(--s, 8px); border-radius: 8px; border: 1px dashed var(--c-accent, #999); }
      .hint a { cursor: pointer; text-decoration: underline; }
      #examples { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 var(--s, 8px) var(--s, 8px); }
      #examples button { font-size: 12px; padding: 4px 8px; }
      .proposal { padding: var(--s, 8px); border-radius: 10px; }
      .proposal-head { font-weight: 600; margin-bottom: 6px; }
      .item { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--divider-color, #ddd); cursor: pointer; }
      .item input { margin-top: 3px; }
      .item-title { font-weight: 500; }
      .item-meta, .item-diff, .item-notes { font-size: 12px; opacity: 0.85; }
      .item-notes { white-space: pre-wrap; font-style: italic; }
      .item-subs { margin: 4px 0 0; padding-left: 18px; font-size: 12px; }
      .actions { display: flex; gap: 8px; margin-top: 8px; }
      .proposal-status { margin-top: 6px; font-size: 12px; }
      #typing { padding: 0 var(--s, 8px); font-size: 12px; opacity: 0.7; }
      footer { display: flex; gap: var(--s, 8px); padding: var(--s, 8px); border-top: 1px solid var(--divider-color, #ddd); }
      #input { flex: 1; resize: vertical; min-height: 44px; max-height: 40vh; font: inherit; }
      #view-settings { overflow-y: auto; padding: var(--s2, 16px); }
      form { display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
      form label { display: flex; flex-direction: column; gap: 4px; font-weight: 500; }
      form small { font-weight: normal; opacity: 0.7; }
      form input, form textarea { font: inherit; width: 100%; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .inline { flex-direction: row !important; align-items: center; font-weight: normal !important; }
      .inline input { width: auto; }
      fieldset { border: 1px solid var(--divider-color, #ddd); border-radius: 8px; display: flex; flex-direction: column; gap: 12px; }
    </style>
  </head>
  <body>
    <header>
      <strong>SP Butler</strong>
      <button id="tab-chat" class="tab active" type="button">Chat</button>
      <button id="tab-settings" class="tab" type="button">Einstellungen</button>
      <span class="spacer"></span>
      <button id="reset" type="button" title="Neues Gespräch">Neu</button>
    </header>

    <section id="view-chat" class="view">
      <div id="no-model-hint" class="hint" hidden>
        Noch kein Chat-Modell konfiguriert. <a id="no-model-link">Zu den Einstellungen</a>
      </div>
      <div id="log"></div>
      <div id="examples">
        <button type="button" data-text="Morgen Reifenwechsel, 30 Minuten, Projekt Auto">＋ Task anlegen</button>
        <button type="button" data-text="Brain-Dump: ">🧠 Brain-Dump</button>
        <button type="button" data-text="Was ist diese Woche fällig?">❓ Diese Woche fällig</button>
        <button type="button" data-text="Schieb alles von heute auf Freitag">📅 Heute → Freitag</button>
      </div>
      <div id="typing" hidden>Butler denkt nach …</div>
      <footer>
        <textarea id="input" rows="2" placeholder="Was soll ich tun? (Enter = senden, Shift+Enter = Zeilenumbruch)"></textarea>
        <button id="send" class="btn-primary" type="button">Senden</button>
      </footer>
    </section>

    <section id="view-settings" class="view" hidden>
      <form id="settings-form" autocomplete="off">
        <fieldset>
          <legend>Endpoint (OpenAI-kompatibel)</legend>
          <label>Base-URL
            <input name="baseUrl" type="url" required placeholder="https://ai-2.1nt.eu/v1" />
            <small>Ohne abschließendes /chat/completions. Der Endpoint muss CORS erlauben.</small>
          </label>
          <label>API-Key
            <input name="apiKey" type="password" />
            <small>Wird nur lokal auf diesem Gerät gespeichert (Secret-Storage), nicht synchronisiert.</small>
          </label>
          <label class="inline"><input id="clear-key" type="checkbox" /> Gespeicherten Key löschen</label>
        </fieldset>
        <fieldset>
          <legend>Modelle</legend>
          <label>Chat-Modell (mit Tool-Calling)
            <input name="chatModel" list="models" required />
          </label>
          <label>Embedding-Modell <small>optional – semantische Suche</small>
            <input name="embeddingModel" list="models" />
          </label>
          <label>Rerank-Modell <small>optional – bessere Trefferreihenfolge</small>
            <input name="rerankModel" list="models" />
          </label>
          <datalist id="models"></datalist>
          <button id="load-models" type="button">Verbindung testen &amp; Modelle laden</button>
          <small>Nutzt die zuletzt gespeicherten Werte – vorher speichern.</small>
        </fieldset>
        <fieldset>
          <legend>Verhalten</legend>
          <div class="row">
            <label>Temperatur <input name="temperature" type="number" min="0" max="2" step="0.1" /></label>
            <label>Max. Tool-Runden <input name="maxToolRounds" type="number" min="1" max="20" /></label>
            <label>Timeout (ms) <input name="requestTimeoutMs" type="number" min="5000" step="1000" /></label>
          </div>
          <label>Eigene Anweisungen
            <textarea name="customInstructions" rows="4" placeholder="z.B. Einkäufe immer ins Projekt Haushalt mit Tag einkaufen."></textarea>
          </label>
        </fieldset>
        <div class="actions">
          <button class="btn-primary" type="submit">Speichern</button>
        </div>
        <div id="settings-status" role="status"></div>
      </form>
    </section>

    <script>
      /*__UI_SCRIPT__*/
    </script>
  </body>
</html>
